<style>

<div><h1 class="lg">همزی</h1><p class="m">همزی؛ همراه هوشمند مسیر یادگیری تو</p><div id="pbw"><div id="pb"></div></div><p>خوش آمدی، آماده‌ی یادگیری هستی؟</p></div></div>

<script>
const $=s=>document.querySelector(s),fa=n=>EN()?String(n):AR()?String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]):String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='hamzi_v1',DEF={user:null,set:{theme:'purple',font:'Vazirmatn',mode:null,notif:true,goal:60,limit:5},sessions:[],tasks:[],g:{},ach:[]};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(K)))}catch(e){S=Object.assign({},DEF)}
S.set=Object.assign({},DEF.set,S.set);

const GR=['اول','دوم','سوم','چهارم','پنجم','ششم','هفتم','هشتم','نهم','دهم','یازدهم','دوازدهم'],LV=['نیاز به تقویت','متوسط','خوب','عالی'],CAT=['درس','تمرین','مرور','آزمون','شخصی'],PR=['','کم','متوسط','زیاد'];

const P={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',check:'<path d="M5 12l5 5 9-10"/>',game:'<path d="M6 6h12a4 4 0 0 1 4 4v4a3 3 0 0 1-5 2l-1-2H8l-1 2a3 3 0 0 1-5-2v-4a4 4 0 0 1 4-4zM8 10v4M6 12h4"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',pin:'<path d="M12 17v5M8 3h8l-1 7 3 3H6l3-3z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',flask:'<path d="M9 3h6M10 3v6L4 19a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-6-10V3M7 15h10"/>',book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5M19 17H6"/>'};

const AC=[['#8b5cf6','#ec4899'],['#0ea5e9','#6366f1'],['#10b981','#06b6d4'],['#f97316','#ef4444'],['#f43f5e','#d946ef'],['#eab308','#f97316'],['#14b8a6','#3b82f6'],['#64748b','#1e293b']];
function avs(a){if(typeof a=='string'&&a.startsWith('data:'))return a;const i=(+a||0)%8,[c1,c2]=AC[i],ac=[`<path d="M32 34a18 14 0 0 1 36 0z" fill="${c1}"/>`,`<circle cx="43" cy="40" r="5" fill="none" stroke="${c2}" stroke-width="2"/><circle cx="57" cy="40" r="5" fill="none" stroke="${c2}" stroke-width="2"/>`,`<path d="M30 42a20 20 0 0 1 40 0" fill="none" stroke="${c2}" stroke-width="4"/><rect x="26" y="40" width="7" height="12" rx="3" fill="${c1}"/><rect x="67" y="40" width="7" height="12" rx="3" fill="${c1}"/>`,`<path d="M50 6l3 8h8l-6 5 2 8-7-5-7 5 2-8-6-5h8z" fill="#fff"/>`][i%4];
return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><circle cx="50" cy="40" r="18" fill="#fff" fill-opacity=".95"/><path d="M18 100c0-22 14-34 32-34s32 12 32 34z" fill="#fff" fill-opacity=".85"/>${ac}<path d="M44 47q6 5 12 0" stroke="${c2}" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`)}
function apply(){const r=document.documentElement;r.dataset.theme=S.set.theme;r.dataset.mode=S.set.mode||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');r.style.setProperty('--font',`'${S.set.font}',sans-serif`);r.style.fontSize=(S.set.fs||100)+'%';const L=S.set.lang||'fa';r.lang=L;r.dir=L=='en'?'ltr':'rtl'}
const C=2*Math.PI*54;

const fmt=s=>{s=Math.max(0,Math.round(s));const h=s/3600|0,m=(s%3600)/60|0,x=s%60,p=n=>String(n).padStart(2,'0');return fa(h?`${h}:${p(m)}:${p(x)}`:`${p(m)}:${p(x)}`)};

const sum=a=>a.reduce((x,y)=>x+y.v,0);
let V='home',GV=null,G={iv:0,lv:0},T={tot:0,left:0,st:'idle',end:0,iv:0,done:null};
function go(v){gstop();exf();V=v;if(v=='games')GV=null;render()}
